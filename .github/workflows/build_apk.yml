name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble Repository Project
        run: |
          mkdir -p app/src/main/java/com/voidontop/panel app/src/main/res/layout app/src/main/res/values app/src/main/assets gradle/wrapper

          if [ -d "assets" ]; then
              cp -r assets/* app/src/main/assets/
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VoidOnTop Panel"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.voidontop.panel'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.voidontop.panel'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="VoidOnTop Panel"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.action.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#121212"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center_horizontal">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="VOID ON TOP PANEL"
                  android:textColor="#00E676"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:layout_marginTop="32dp"
                  android:layout_marginBottom="24dp" />

              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Status: Panel Ready"
                  android:textColor="#B0BEC5"
                  android:textSize="14sp"
                  android:gravity="center"
                  android:layout_marginBottom="32dp" />

              <Button
                  android:id="@+id/btnToggle"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Activate Overlay"
                  android:backgroundTint="#00E676"
                  android:textColor="#000000"
                  android:textStyle="bold"
                  android:layout_marginBottom="16dp" />

              <Button
                  android:id="@+id/btnAimAssist"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Toggle Aim Assist"
                  android:backgroundTint="#1E1E1E"
                  android:textColor="#FFFFFF"
                  android:layout_marginBottom="12dp" />

              <Button
                  android:id="@+id/btnSpeedHack"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Toggle Speed Hack"
                  android:backgroundTint="#1E1E1E"
                  android:textColor="#FFFFFF" />

          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/voidontop/panel/MainActivity.kt
          package com.voidontop.panel

          import android.os.Bundle
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private var isActive = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val statusText = findViewById<TextView>(R.id.statusText)
                  val btnToggle = findViewById<Button>(R.id.btnToggle)
                  val btnAimAssist = findViewById<Button>(R.id.btnAimAssist)
                  val btnSpeedHack = findViewById<Button>(R.id.btnSpeedHack)

                  btnToggle.setOnClickListener {
                      isActive = !isActive
                      if (isActive) {
                          statusText.text = "Status: Overlay Active"
                          btnToggle.text = "Deactivate Overlay"
                          Toast.makeText(this, "VoidOnTop Service Started", Toast.LENGTH_SHORT).show()
                      } else {
                          statusText.text = "Status: Panel Ready"
                          btnToggle.text = "Activate Overlay"
                          Toast.makeText(this, "VoidOnTop Service Stopped", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnAimAssist.setOnClickListener {
                      Toast.makeText(this, "Aim Assist Toggled", Toast.LENGTH_SHORT).show()
                  }

                  btnSpeedHack.setOnClickListener {
                      Toast.makeText(this, "Speed Hack Toggled", Toast.LENGTH_SHORT).show()
                  }
              }
          }
          EOF

          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -s https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -s https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew -o gradlew
          chmod +x gradlew

      - name: Build APK Artifact
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apkg.apk