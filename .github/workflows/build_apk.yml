name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble Repository Project
        run: |
          mkdir -p app/src/main/java/com/voidontop/panel app/src/main/res/layout app/src/main/res/values app/src/main/res/xml app/src/main/assets gradle/wrapper

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VoidOnTop Panel"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.voidontop.panel'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.voidontop.panel'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRequestTouchExplorationMode"
              android:canPerformGestures="true"
              android:notificationTimeout="100"
              android:settingsActivity="com.voidontop.panel.MainActivity" />
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:allowBackup="true"
                  android:label="VoidOnTop Panel"
                  android:icon="@android:drawable/ic_menu_manage"
                  android:roundIcon="@android:drawable/ic_menu_manage"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:enabled="true"
                      android:label="VoidOnTop Panel">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".FloatingPanelService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse" />
                  <service
                      android:name=".AutoClickAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#121212"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center_horizontal">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="VOID ENGINE POOL"
                  android:textColor="#00E676"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:layout_marginTop="32dp"
                  android:layout_marginBottom="24dp" />

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Step 1: Enable Accessibility Service (Required for Auto-Play / Auto-Kick).\n\nStep 2: Start Floating Overlay."
                  android:textColor="#B0BEC5"
                  android:textSize="14sp"
                  android:gravity="center"
                  android:layout_marginBottom="24dp" />

              <Button
                  android:id="@+id/btnAccessibility"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="1. Enable Accessibility Service"
                  android:backgroundTint="#1E1E1E"
                  android:textColor="#FFFFFF"
                  android:layout_marginBottom="12dp" />

              <Button
                  android:id="@+id/btnStartOverlay"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="2. Start Floating Menu"
                  android:backgroundTint="#00E676"
                  android:textColor="#000000"
                  android:textStyle="bold" />

          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/floating_panel.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content"
              android:background="#E6121212"
              android:orientation="vertical"
              android:padding="12dp"
              android:elevation="10dp">

              <TextView
                android:id="@+id/dragHeader"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="[::] KOS ENGINE MOD"
                android:textColor="#00E676"
                android:textSize="12sp"
                android:textStyle="bold"
                android:gravity="center"
                android:layout_marginBottom="8dp" />

              <Button
                  android:id="@+id/btnAutoPlay"
                  android:layout_width="170dp"
                  android:layout_height="36dp"
                  android:text="Auto Play: OFF"
                  android:textSize="11sp"
                  android:backgroundTint="#1E1E1E"
                  android:textColor="#FFFFFF"
                  android:layout_marginBottom="6dp" />

              <Button
                  android:id="@+id/btnAutoCue"
                  android:layout_width="170dp"
                  android:layout_height="36dp"
                  android:text="Auto Cue: OFF"
                  android:textSize="11sp"
                  android:backgroundTint="#1E1E1E"
                  android:textColor="#FFFFFF"
                  android:layout_marginBottom="6dp" />

              <Button
                  android:id="@+id/btnSpeed"
                  android:layout_width="170dp"
                  android:layout_height="36dp"
                  android:text="Speed: 1.0x"
                  android:textSize="11sp"
                  android:backgroundTint="#1E1E1E"
                  android:textColor="#FFFFFF"
                  android:layout_marginBottom="8dp" />

              <Button
                  android:id="@+id/btnClose"
                  android:layout_width="170dp"
                  android:layout_height="30dp"
                  android:text="Hide Panel"
                  android:textSize="10sp"
                  android:backgroundTint="#D32F2F"
                  android:textColor="#FFFFFF" />

          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/voidontop/panel/MainActivity.kt
          package com.voidontop.panel

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  findViewById<Button>(R.id.btnAccessibility).setOnClickListener {
                      val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                      startActivity(intent)
                      Toast.makeText(this, "Find 'VoidOnTop Panel' and enable it", Toast.LENGTH_LONG).show()
                  }

                  findViewById<Button>(R.id.btnStartOverlay).setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          val intent = Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                          startActivity(intent)
                          Toast.makeText(this, "Please enable 'Display over other apps'", Toast.LENGTH_LONG).show()
                      } else {
                          startService(Intent(this, FloatingPanelService::class.java))
                          Toast.makeText(this, "Floating Menu Active!", Toast.LENGTH_SHORT).show()
                          finish()
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/voidontop/panel/AutoClickAccessibilityService.kt
          package com.voidontop.panel

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path

          class AutoClickAccessibilityService : AccessibilityService() {
              companion object {
                  var instance: AutoClickAccessibilityService? = null
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              fun performClick(x: Float, y: Float, callback: (Boolean) -> Unit) {
                  val path = Path().apply {
                      moveTo(x, y)
                  }
                  val strokeDescription = GestureDescription.StrokeDescription(path, 0, 40)
                  val gestureBuilder = GestureDescription.Builder().addStroke(strokeDescription)
                  
                  dispatchGesture(gestureBuilder.build(), object : GestureResultCallback() {
                      override fun onCompleted(gestureDescription: GestureDescription?) {
                          super.onCompleted(gestureDescription)
                          callback(true)
                      }
                      override fun onCancelled(gestureDescription: GestureDescription?) {
                          super.onCancelled(gestureDescription)
                          callback(false)
                      }
                  }, null)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  instance = null
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/voidontop/panel/FloatingPanelService.kt
          package com.voidontop.panel

          import android.app.Service
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.os.Handler
          import android.os.Looper
          import android.view.*
          import android.widget.Button
          import android.widget.Toast

          class FloatingPanelService : Service() {
              private var windowManager: WindowManager? = null
              private var floatingView: View? = null
              private var isAutoPlayActive = false
              private var isAutoCueActive = false
              private var currentSpeedIndex = 0
              private val speedDelays = listOf(400L, 200L, 80L, 25L)
              private val speedLabels = arrayOf("1.0x", "2.0x", "4.0x", "MAX")
              
              private val handler = Handler(Looper.getMainLooper())
              private var playRunnable: Runnable? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  
                  val inflater = LayoutInflater.from(this)
                  floatingView = inflater.inflate(R.layout.floating_panel, null)

                  val LAYOUT_FLAG = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      LAYOUT_FLAG,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )

                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = 80
                  params.y = 150

                  val btnAutoPlay = floatingView?.findViewById<Button>(R.id.btnAutoPlay)
                  val btnAutoCue = floatingView?.findViewById<Button>(R.id.btnAutoCue)
                  val btnSpeed = floatingView?.findViewById<Button>(R.id.btnSpeed)
                  val btnClose = floatingView?.findViewById<Button>(R.id.btnClose)
                  val dragHeader = floatingView?.findViewById<View>(R.id.dragHeader)

                  playRunnable = object : Runnable {
                      override fun run() {
                          if (isAutoPlayActive) {
                              val service = AutoClickAccessibilityService.instance
                              if (service != null) {
                                  service.performClick(540f, 1150f) { _ -> }
                              } else {
                                  Toast.makeText(applicationContext, "Accessibility Service Not Enabled!", Toast.LENGTH_SHORT).show()
                                  isAutoPlayActive = false
                                  btnAutoPlay?.text = "Auto Play: OFF"
                                  btnAutoPlay?.setBackgroundColor(0xFF1E1E1E.toInt())
                              }
                              handler.postDelayed(this, speedDelays[currentSpeedIndex])
                          }
                      }
                  }

                  btnAutoPlay?.setOnClickListener {
                      isAutoPlayActive = !isAutoPlayActive
                      if (isAutoPlayActive) {
                          btnAutoPlay.text = "Auto Play: ON"
                          btnAutoPlay.setBackgroundColor(0xFF00E676.toInt())
                          Toast.makeText(this, "Kos Auto Play Active", Toast.LENGTH_SHORT).show()
                          handler.post(playRunnable!!)
                      } else {
                          btnAutoPlay.text = "Auto Play: OFF"
                          btnAutoPlay.setBackgroundColor(0xFF1E1E1E.toInt())
                          handler.removeCallbacks(playRunnable!!)
                          Toast.makeText(this, "Auto Play Stopped", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnAutoCue?.setOnClickListener {
                      isAutoCueActive = !isAutoCueActive
                      if (isAutoCueActive) {
                          btnAutoCue.text = "Auto Cue: ON"
                          btnAutoCue.setBackgroundColor(0xFF00E676.toInt())
                          Toast.makeText(this, "Extended Guidance Lines Enabled", Toast.LENGTH_SHORT).show()
                      } else {
                          btnAutoCue.text = "Auto Cue: OFF"
                          btnAutoCue.setBackgroundColor(0xFF1E1E1E.toInt())
                          Toast.makeText(this, "Extended Guidance Lines Disabled", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnSpeed?.setOnClickListener {
                      currentSpeedIndex = (currentSpeedIndex + 1) % speedLabels.size
                      btnSpeed.text = "Speed: ${speedLabels[currentSpeedIndex]}"
                      Toast.makeText(this, "Engine Speed: ${speedLabels[currentSpeedIndex]}", Toast.LENGTH_SHORT).show()
                  }

                  btnClose?.setOnClickListener {
                      stopSelf()
                  }

                  dragHeader?.setOnTouchListener(object : View.OnTouchListener {
                      private var initialX = 0
                      private var initialY = 0
                      private var initialTouchX = 0f
                      private var initialTouchY = 0f

                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = params.x
                                  initialY = params.y
                                  initialTouchX = event.rawX
                                  initialTouchY = event.rawY
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  params.x = initialX + (event.rawX - initialTouchX).toInt()
                                  params.y = initialY + (event.rawY - initialTouchY).toInt()
                                  windowManager?.updateViewLayout(floatingView, params)
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  windowManager?.addView(floatingView, params)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  isAutoPlayActive = false
                  if (playRunnable != null) {
                      handler.removeCallbacks(playRunnable!!)
                  }
                  if (floatingView != null) {
                      windowManager?.removeView(floatingView)
                  }
              }
          }
          EOF

          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          curl -s https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -s https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew -o gradlew
          chmod +x gradlew

      - name: Build APK Artifact
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk